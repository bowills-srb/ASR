name: Android APK

# Builds a debug APK in the cloud (no local machine needed) and publishes it as
# a rolling pre-release asset you can download and sideload from your phone.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write # needed to publish the release asset

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicetext-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Rolling pre-release: the "android-debug" tag always points at the newest
      # build, so the Releases page has a stable, direct .apk download link.
      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/claude/voice-text-android-mvp-om2ugw'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: VoiceText debug APK (latest)
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
